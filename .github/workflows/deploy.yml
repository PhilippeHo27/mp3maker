name: Validate MP3 Maker
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python -m pip install -r requirements-worker.txt
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: docker build -t mp3maker-web .
      - run: docker build -f Dockerfile.proxy -t mp3maker-proxy .
      - run: docker build -f Dockerfile.worker -t mp3maker-worker .
      - run: docker run --rm mp3maker-worker selftest
